<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飯飯之輩</title>
<meta name="description" content="部隊打飯班的便當分箱計數工具：一箱 4 層 × 6 個，自動提醒換層、換箱、換連隊。">
<!-- Android 的狀態列會塗成 theme-color。塗成跟 App 頂端一樣的顏色，
     時間電量就像直接浮在背景上，視覺上畫面是填滿到最頂端的。
     實際值由 ui.js 的 syncThemeColor() 依目前主題同步。 -->
<meta name="theme-color" id="meta-theme" content="#EBE5D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent：iOS 加到主畫面後，網頁內容會延伸到狀態列底下，看起來更沉浸。
     搭配 CSS 的 env(safe-area-inset-top) 才不會被時間跟電量蓋住。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="飯飯之輩">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 圖示 sprite -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-bento" viewBox="0 0 24 24">
    <rect x="2.6" y="5" width="18.8" height="14" rx="3.2" fill="currentColor" opacity=".16"/>
    <rect x="2.6" y="5" width="18.8" height="14" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M2.6 8.8h18.8" stroke="currentColor" stroke-width="1.3" opacity=".45"/>
    <circle cx="8" cy="14.3" r="2.3" fill="currentColor" opacity=".9"/>
    <rect x="12.4" y="12" width="6.6" height="1.9" rx=".95" fill="currentColor" opacity=".72"/>
    <rect x="12.4" y="15.1" width="6.6" height="1.9" rx=".95" fill="currentColor" opacity=".72"/>
  </symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24">
    <path d="M20.5 3.5C10 3.5 4 8.6 4 15.7c0 1.6.4 3 1 4.2a1 1 0 0 0 1.8-.9c-.2-.4-.3-.8-.4-1.3 1.2-3.6 4-6.2 7.6-7.6-3.2 2-5.4 4.6-6.6 7.9 9.1 1.4 13.6-4.6 13.1-14.5z" fill="currentColor"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-1.7-1L15 3.5H11l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.3-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🍱</span>
      <div class="brand-text">
        <h1>飯飯之輩</h1>
        <p id="date-label" class="brand-sub">還沒設定便當數</p>
      </div>
    </div>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="設定">
      <svg width="22" height="22" aria-hidden="true"><use href="#i-gear"/></svg>
    </button>
  </header>

  <!-- ============ 設定畫面 ============ -->
  <section id="screen-setup" class="screen" aria-label="設定便當數">

    <div class="card">
      <div class="card-head">
        <span class="step-badge">1</span>
        <h2>貼上班長的訊息</h2>
      </div>
      <p class="hint">整段複製貼上就好，格式亂一點也沒關係，解析完可以手動改。</p>
      <textarea id="paste-input" rows="8" spellcheck="false"
        placeholder="明天便當數（7/28）禮拜二&#10;&#10;八仙管理員&#10;中：3&#10;戰&#10;早：中：15晚：63+1素&#10;火&#10;早：10中：30晚：20"></textarea>
      <div class="btn-row">
        <button id="btn-parse" class="btn btn-primary" type="button">✨ 自動解析</button>
        <button id="btn-sample" class="btn btn-ghost" type="button">填入範例</button>
        <button id="btn-clear-paste" class="btn btn-ghost" type="button">清空</button>
      </div>
      <div id="parse-warnings" class="warnings" hidden></div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="step-badge">2</span>
        <h2>確認便當數</h2>
      </div>
      <p class="hint">🥬 那一格是素食數量，會另外標記提醒。填 0 代表這一餐不用打。</p>
      <div id="plan-table" class="plan-table-wrap"></div>
      <button id="btn-add-unit" class="btn btn-ghost btn-block" type="button">＋ 新增單位</button>
    </div>

    <div class="card summary-card">
      <div class="card-head">
        <span class="step-badge">3</span>
        <h2>今日總量</h2>
      </div>
      <div id="plan-summary"></div>
    </div>

    <button id="btn-start" class="btn btn-primary btn-lg btn-block" type="button">開始打飯 →</button>
    <p class="footnote">進度會自動存在這台裝置的瀏覽器裡，關掉再開會接續。</p>
  </section>

  <!-- ============ 作業畫面 ============ -->
  <section id="screen-work" class="screen" aria-label="打飯作業">
    <nav id="meal-tabs" class="meal-tabs" aria-label="餐別"></nav>
    <div id="hero" class="hero"></div>
    <div id="veg-banner" class="veg-banner" hidden>
      <svg width="18" height="18" aria-hidden="true"><use href="#i-leaf"/></svg>
      <span>接下來這一個要放<b>素食便當</b></span>
    </div>
    <div id="unit-chips" class="unit-chips" role="tablist" aria-label="連隊"></div>
    <div id="box-card" class="box-card"></div>
    <details id="overview" class="overview">
      <summary>本餐全連隊進度</summary>
      <div id="overview-table"></div>
    </details>

    <details id="drinks" class="overview drinks">
      <summary>🥤 飲料箱數</summary>
      <div class="drinks-body">
        <div class="drink-config">
          <label for="drink-per-case">一箱</label>
          <input type="number" id="drink-per-case" inputmode="numeric" min="1" max="999" value="24">
          <span>罐</span>
          <button type="button" class="case-preset" data-case="24">24</button>
          <button type="button" class="case-preset" data-case="18">18</button>
        </div>
        <div id="drink-rows"></div>
      </div>
    </details>

    <div class="counter-spacer"></div>
  </section>

  <!-- 底部計數列（只在作業畫面出現） -->
  <div id="counter-bar" class="counter-bar" hidden>
    <button id="btn-minus" class="btn-minus" type="button" aria-label="收回一個便當">↺<span>−1</span></button>
    <button id="btn-plus" class="btn-plus" type="button">
      <span class="plus-sign">＋1</span>
      <span class="plus-sub" id="plus-sub"></span>
    </button>
  </div>
</div>

<!-- 設定面板 -->
<div id="settings-sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet-panel" role="dialog" aria-label="設定">
    <div class="sheet-handle"></div>
    <h2>設定</h2>
    <label class="toggle-row"><span>🔊 音效提醒</span><input type="checkbox" id="set-sound"></label>
    <label class="toggle-row"><span>📳 震動提醒</span><input type="checkbox" id="set-haptic"></label>
    <div class="toggle-row">
      <span>🎨 外觀</span>
      <select id="set-theme">
        <option value="auto">跟隨系統</option>
        <option value="light">淺色</option>
        <option value="dark">深色</option>
      </select>
    </div>
    <div class="toggle-row">
      <span>🥬 素食位置</span>
      <select id="set-veg">
        <option value="last">放最後（疊最上面）</option>
        <option value="first">放最前（最底層）</option>
      </select>
    </div>
    <hr>
    <button id="btn-edit-plan" class="btn btn-ghost btn-block" type="button">✏️ 修改今天的便當數</button>
    <button id="btn-reset-meal" class="btn btn-ghost btn-block danger" type="button">↺ 重設「本餐」進度</button>
    <button id="btn-reset-all" class="btn btn-ghost btn-block danger" type="button">🗑 全部清空重來</button>
    <button class="btn btn-primary btn-block" type="button" data-close-sheet>關閉</button>
  </div>
</div>

<div id="overlay-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<noscript><p style="padding:2rem;text-align:center">這個工具需要開啟 JavaScript 才能使用。</p></noscript>

<script src="js/units.js"></script>
<script src="js/parser.js"></script>
<script src="js/state.js"></script>
<script src="js/effects.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
